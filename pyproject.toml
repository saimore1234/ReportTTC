[project]
name = "monthly_production_report"
authors = [{ name = "Monthly Production Report", email = "admin@example.com" }]
description = "Monthly Production Quantity & Value report for ERPNext v15 manufacturing"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
